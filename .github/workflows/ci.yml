name: CI

on:
  push:
    branches: [ "dev", "test", "prod" ]
  pull_request:
    branches: [ "test", "prod" ]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests for API
        run: mvn -f api/pom.xml -B test

  api-docker-build:
    runs-on: ubuntu-latest
    needs: [ api-tests ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker build (API)
        run: docker build -t mycellius-api:${{ github.sha }} ./api

  deploy-dev:
    runs-on: [ self-hosted, dev-runner ]
    needs: [ api-tests, api-docker-build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - name: Ensure deploy script is executable
        run: |
          cd /var/www/html/mycellius
          chmod +x infra/deploy/deploy.sh
      - name: Deploy DEV
        run: |
          cd /var/www/html/mycellius
          ./infra/deploy/deploy.sh dev DEV

  deploy-test:
    runs-on: [ self-hosted, test-runner ]
    needs: [ api-tests, api-docker-build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    steps:
      - name: Ensure deploy script is executable
        run: |
          cd /var/www/html/mycellius
          chmod +x infra/deploy/deploy.sh
      - name: Deploy TEST
        run: |
          cd /var/www/html/mycellius
          ./infra/deploy/deploy.sh test TEST

  deploy-prod:
    runs-on: [ self-hosted, prod-runner ]
    needs: [ api-tests, api-docker-build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    steps:
      - uses: actions/checkout@v4

      - name: Ensure deploy script is executable
        run: chmod +x infra/deploy/deploy.sh

      - name: Deploy PROD
        run: ./infra/deploy/deploy.sh prod PROD

  deploy-web-prod:
    runs-on: [ self-hosted, prod-runner ]
    needs: [ api-tests, api-docker-build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    steps:
      - uses: actions/checkout@v4

      - name: Who am I (debug)
        run: whoami

      - name: Build React (web)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Stage build (owned by clarisse)
        run: |
          mkdir -p /var/www/deploy/mycellius-web
          rm -rf /var/www/deploy/mycellius-web/*
          cp -r web/dist/* /var/www/deploy/mycellius-web/

      - name: Publish to nginx (single sudo)
        run: |
          sudo rsync -a --delete /var/www/deploy/mycellius-web/ /var/www/html/app/
          sudo chown -R www-data:www-data /var/www/html/app
          sudo systemctl reload nginx