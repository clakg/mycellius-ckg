name: CI

on:
  push:
    branches: [ "dev", "test", "prod" ]
  pull_request:
    branches: [ "test", "prod" ]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests for API
        run: mvn -f api/pom.xml -B test

  api-docker-build:
    runs-on: ubuntu-latest
    needs: [ api-tests ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker build (API)
        run: docker build -t mycellius-api:${{ github.sha }} ./api

  deploy-dev:
    runs-on: self-hosted
    needs: [ api-tests, api-docker-build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - name: Deploy DEV (local)
        run: |
          cd /var/www/html/mycellius
          ./infra/deploy/deploy.sh dev DEV

  deploy-test:
    runs-on: self-hosted
    needs: [ api-tests, api-docker-build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    steps:
      - name: Deploy TEST (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_TEST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/html/mycellius
            ./infra/deploy/deploy.sh test TEST