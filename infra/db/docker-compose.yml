version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: mycellius-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mycellius
      MYSQL_USER: mycellius
      MYSQL_PASSWORD: mycellius
    ports:
      - "3306:3306"
    volumes:
      - ./data:/var/lib/mysql