spring.datasource.url=jdbc:mysql://localhost:3306/mycellius?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=mycellius
spring.datasource.password=mycellius
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.default-property-inclusion=ALWAYS

# JWT
mycellius.jwt.secret=CHANGE_ME_DEV_SECRET_please
mycellius.jwt.issuer=mycellius-api
mycellius.jwt.ttlSeconds=7200

# CORS (front dev Vite)
mycellius.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Seed users
mycellius.seed.enabled=true
mycellius.seed.admin.username=admin
mycellius.seed.admin.password=Admin123!
mycellius.seed.dev.username=dev
mycellius.seed.dev.password=Dev123!
mycellius.seed.stagiaire.username=stagiaire
mycellius.seed.stagiaire.password=Stagiaire123!

# Valeurs par d\uFFFDfaut (surcharges par variables d environnement sur VM)
mycellius.env=${MYCELLIUS_ENV:DEV}
mycellius.version=${MYCELLIUS_VERSION:local}